[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gonnx"
version = "0.1.0"
description = "Python SDK for gonnx model workers"
requires-python = ">=3.10"
license = { text = "MIT" }
readme = "README.md"

dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
cpu = ["onnxruntime>=1.18"]
gpu = ["onnxruntime-gpu>=1.18"]
dev = ["pytest>=8", "pytest-timeout"]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
