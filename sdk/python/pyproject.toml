[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "gonnx"
version = "0.1.0"
description = "Python worker SDK for the gonnx ONNX runtime"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
runtime = ["onnxruntime>=1.20"]
runtime-gpu = ["onnxruntime-gpu>=1.20"]
