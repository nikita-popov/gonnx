name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: tidy
        run: go mod tidy

      # ── Go binaries ────────────────────────────────────────────────────
      - name: build gonnxd
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o "gonnxd" ./cmd/gonnxd

      - name: build gonnxctl
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
            -o "gonnxctl" ./cmd/gonnxctl

      # ── Python SDK wheel (arch-independent, built once on amd64) ──────
      - name: build wheel
        if: matrix.goarch == 'amd64'
        run: |
          pip install -q build
          python -m build --wheel --outdir dist/ sdk/python

      # ── Assemble tarball ───────────────────────────────────────────────
      - name: assemble tarball
        run: |
          ARCH=${{ matrix.goarch }}
          TAG=${{ github.ref_name }}
          TARNAME="gonnx-linux-${ARCH}-${TAG}.tar.gz"

          STAGING="staging-${ARCH}"
          mkdir -p "${STAGING}"

          cp gonnxd gonnxctl "${STAGING}/"
          chmod +x "${STAGING}/gonnxd" "${STAGING}/gonnxctl"

          # include wheel only on amd64 build; arm64 reuses same pure-python wheel
          if [ "$ARCH" = "amd64" ] && ls dist/*.whl 2>/dev/null; then
            cp dist/*.whl "${STAGING}/"
          fi

          # generate per-file checksums
          (cd "${STAGING}" && sha256sum * > checksums.sha256)

          tar -czf "${TARNAME}" -C "${STAGING}" .

          # checksum of the tarball itself
          sha256sum "${TARNAME}" > "${TARNAME}.sha256"

          echo "TARNAME=${TARNAME}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-${{ matrix.goarch }}
          path: |
            gonnx-linux-${{ matrix.goarch }}-*.tar.gz
            gonnx-linux-${{ matrix.goarch }}-*.tar.gz.sha256

  # ── wheel for arm64 (reuse the pure-python wheel built on amd64) ─────
  attach-wheel-arm64:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-linux-amd64
          path: dist-amd64

      - uses: actions/download-artifact@v4
        with:
          name: dist-linux-arm64
          path: dist-arm64

      - name: inject wheel into arm64 tarball
        run: |
          TAG=${{ github.ref_name }}
          AMD64_TAR="dist-amd64/gonnx-linux-amd64-${TAG}.tar.gz"
          ARM64_TAR="dist-arm64/gonnx-linux-arm64-${TAG}.tar.gz"
          TARNAME="gonnx-linux-arm64-${TAG}.tar.gz"

          # extract wheel from amd64 tarball
          mkdir tmp-amd64
          tar -xzf "${AMD64_TAR}" -C tmp-amd64
          WHL=$(ls tmp-amd64/*.whl 2>/dev/null | head -1)

          if [ -n "$WHL" ]; then
            mkdir tmp-arm64
            tar -xzf "${ARM64_TAR}" -C tmp-arm64
            cp "$WHL" tmp-arm64/
            (cd tmp-arm64 && sha256sum * > checksums.sha256)
            tar -czf "${TARNAME}" -C tmp-arm64 .
            sha256sum "${TARNAME}" > "${TARNAME}.sha256"
            cp "${TARNAME}" "${TARNAME}.sha256" dist-arm64/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-arm64-final
          path: |
            dist-arm64/gonnx-linux-arm64-*.tar.gz
            dist-arm64/gonnx-linux-arm64-*.tar.gz.sha256

  release:
    needs: [build, attach-wheel-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужна вся история тегов

      - uses: actions/download-artifact@v4
        with:
          name: dist-linux-amd64
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: dist-linux-arm64-final
          path: dist

      # ── Changelog: коммиты от предыдущего тега до текущего ────────────
      - name: generate changelog
        id: changelog
        run: |
          CURRENT="${{ github.ref_name }}"

          # предыдущий тег — ближайший annotated/lightweight тег, исключая текущий
          PREV=$(git tag --sort=-version:refname \
                   | grep -v "^${CURRENT}$" \
                   | head -1)

          if [ -z "$PREV" ]; then
            RANGE="$CURRENT"
            HEADER="_First release — all commits:_"
          else
            RANGE="${PREV}..${CURRENT}"
            HEADER="_Changes since ${PREV}:_"
          fi

          # формат: "<short-sha> <subject>" сгруппированные по conventional commit prefix
          LOG=$(git log "$RANGE" \
                  --pretty=format:"%h %s" \
                  --no-merges)

          # известные prefixes — используем для фильтрации Other
          KNOWN_PREFIXES="feat fix perf refactor ci docs chore"

          make_section() {
            local prefix="$1" title="$2"
            local lines
            lines=$(echo "$LOG" | grep -i "^[a-f0-9]\+ ${prefix}" || true)
            if [ -n "$lines" ]; then
              printf '\n**%s**\n' "$title"
              echo "$lines" | while IFS= read -r line; do
                sha=$(echo "$line" | cut -d' ' -f1)
                msg=$(echo "$line" | cut -d' ' -f2-)
                printf -- '- [`%s`](https://github.com/${{ github.repository }}/commit/%s) %s\n' \
                  "$sha" "$sha" "$msg"
              done
            fi
          }

          make_other_section() {
            # коммиты, не соответствующие ни одному из known prefixes
            local pattern
            pattern=$(echo "$KNOWN_PREFIXES" | tr ' ' '|')
            local lines
            lines=$(echo "$LOG" | grep -iv "^[a-f0-9]\+ \($pattern\)" || true)
            if [ -n "$lines" ]; then
              printf '\n**%s**\n' '📦 Other'
              echo "$lines" | while IFS= read -r line; do
                sha=$(echo "$line" | cut -d' ' -f1)
                msg=$(echo "$line" | cut -d' ' -f2-)
                printf -- '- [`%s`](https://github.com/${{ github.repository }}/commit/%s) %s\n' \
                  "$sha" "$sha" "$msg"
              done
            fi
          }

          {
            echo "$HEADER"
            make_section 'feat'     '🚀 Features'
            make_section 'fix'      '🐛 Bug fixes'
            make_section 'perf'     '⚡ Performance'
            make_section 'refactor' '♻️  Refactor'
            make_section 'ci'       '👷 CI / build'
            make_section 'docs'     '📝 Docs'
            make_section 'chore'    '🔧 Chore'
            make_other_section
          } > changelog.md

          echo "path=changelog.md" >> "$GITHUB_OUTPUT"

      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ steps.changelog.outputs.path }}
